<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>BAP Yönetim Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --zemin:#E9ECEE; --kagit:#FBFAF7; --kum:#E6DCCA; --kum-acik:#F3EEE4;
  --mavi:#A8C3D6; --mavi-acik:#E3EDF4; --mavi-koyu:#2E5B78;
  --murekkep:#34312D; --gri:#76706A; --cizgi:#D9D4CB;
  --iyi:#3C7A52; --dikkat:#A8741E; --kotu:#A33F2C;
  --iyi-z:#E4F0E7; --dikkat-z:#F6ECD9; --kotu-z:#F5E1DC;
  --yazi:"Onest", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --r-kucuk:6px; --r:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --zemin:#1E2124; --kagit:#272A2E; --kum:#3A352D; --kum-acik:#2F2C27;
    --mavi:#5F88A5; --mavi-acik:#26323B; --mavi-koyu:#A9CBE3;
    --murekkep:#ECE8E1; --gri:#A8A29A; --cizgi:#3A3D42;
    --iyi:#7CC293; --dikkat:#E0B462; --kotu:#EC8C78;
    --iyi-z:#223329; --dikkat-z:#3A3021; --kotu-z:#3D2622;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font-family:var(--yazi);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
a{color:var(--mavi-koyu)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mavi-koyu);outline-offset:2px;border-radius:4px}

.kabuk{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.yan{background:var(--kagit);border-right:1px solid var(--cizgi);padding:26px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.marka{padding:0 12px 22px}
.marka b{display:block;font-size:30px;letter-spacing:.14em;font-weight:700;color:var(--murekkep);line-height:1}
.marka span{display:block;margin-top:6px;font-size:13px;color:var(--gri)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:var(--r-kucuk);color:var(--murekkep);font-size:14.5px}
.nav button:hover{background:var(--kum-acik)}
.nav button[aria-current="page"]{background:var(--mavi-acik);color:var(--mavi-koyu);font-weight:600}
.nav .rozet{font-size:12px;font-weight:600;background:var(--kotu);color:#fff;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.nav button:focus-visible{outline:2px solid var(--mavi-koyu)}
.yan-alt{margin-top:26px;padding:14px 12px 0;border-top:1px solid var(--cizgi);font-size:12.5px;color:var(--gri)}

.ana{padding:30px 38px 60px;max-width:1240px;width:100%}
.ust{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
h1{font-size:34px;line-height:1.12;margin:0;font-weight:700;letter-spacing:-.015em;max-width:22ch}
.alt-baslik{margin:8px 0 0;color:var(--gri);font-size:15px}
.yenile{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--gri)}
.dugme{cursor:pointer;border:1px solid var(--cizgi);background:var(--kagit);border-radius:var(--r-kucuk);padding:8px 14px;font-weight:500}
.dugme:hover{border-color:var(--mavi-koyu)}
.dugme[disabled]{opacity:.55;cursor:wait}

/* Veri nabzı: her kaynağın ne kadar taze olduğu */
.nabiz{margin:26px 0 30px;background:var(--kagit);border:1px solid var(--cizgi);border-radius:var(--r);padding:16px 18px}
.nabiz-ust{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.nabiz-ust h2{margin:0;font-size:16px}
.nabiz-ust p{margin:0;font-size:13px;color:var(--gri)}
.serit{display:flex;flex-wrap:wrap;gap:8px}
.kaynak{display:flex;align-items:center;gap:8px;padding:6px 11px 6px 9px;border-radius:999px;font-size:13px;text-decoration:none;color:var(--murekkep);border:1px solid transparent}
.kaynak i{width:9px;height:9px;border-radius:50%;flex:none}
.kaynak em{font-style:normal;color:var(--gri)}
.k-iyi{background:var(--iyi-z)} .k-iyi i{background:var(--iyi)}
.k-dikkat{background:var(--dikkat-z)} .k-dikkat i{background:var(--dikkat)}
.k-kotu{background:var(--kotu-z)} .k-kotu i{background:var(--kotu)}
.kaynak:hover{border-color:var(--cizgi)}

.rakamlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--cizgi);border:1px solid var(--cizgi);border-radius:var(--r);overflow:hidden;margin-bottom:30px}
.rakam{background:var(--kagit);padding:16px 18px}
.rakam .ad{font-size:13px;color:var(--gri)}
.rakam .deger{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.rakam .not{font-size:12.5px;color:var(--gri);margin-top:2px}
.rakam .not.yukari{color:var(--iyi)} .rakam .not.asagi{color:var(--kotu)}

.iki{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:26px;align-items:start}
.blok{margin-bottom:28px}
.blok>h2{font-size:18px;margin:0 0 4px}
.blok>.aciklama{margin:0 0 12px;color:var(--gri);font-size:14px;max-width:70ch}
.liste{background:var(--kagit);border:1px solid var(--cizgi);border-radius:var(--r)}
.satir{padding:14px 18px;border-top:1px solid var(--cizgi)}
.satir:first-child{border-top:0}
.satir h3{margin:0;font-size:15.5px;font-weight:600}
.satir p{margin:4px 0 0;font-size:14px;color:var(--murekkep);max-width:75ch}
.satir .meta{margin-top:6px;font-size:12.5px;color:var(--gri);display:flex;gap:14px;flex-wrap:wrap}
.etiket{display:inline-block;white-space:nowrap;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.e-iyi{background:var(--iyi-z);color:var(--iyi)} .e-dikkat{background:var(--dikkat-z);color:var(--dikkat)} .e-kotu{background:var(--kotu-z);color:var(--kotu)} .e-notr{background:var(--mavi-acik);color:var(--mavi-koyu)}
.bos{padding:18px;color:var(--gri);font-size:14px}

.tablo{width:100%;border-collapse:collapse;font-size:14px}
.tablo th{text-align:left;font-weight:500;color:var(--gri);font-size:12.5px;padding:10px 18px;border-bottom:1px solid var(--cizgi)}
.tablo td{padding:10px 18px;border-top:1px solid var(--cizgi)}
.tablo tr:first-child td{border-top:0}
.tablo td.sag,.tablo th.sag{text-align:right;white-space:nowrap}
.kaydir{overflow-x:auto}

.cubuk{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;padding:8px 18px;font-size:14px}
.cubuk .iz{height:10px;background:var(--mavi-acik);border-radius:5px;overflow:hidden}
.cubuk .iz b{display:block;height:100%;background:var(--mavi)}
.cubuk .sayi{font-weight:600;min-width:84px;text-align:right}

.grafik{background:var(--kagit);border:1px solid var(--cizgi);border-radius:var(--r);padding:18px 18px 10px}
.grafik svg{width:100%;height:auto;display:block}
.grafik text{fill:var(--gri);font-size:11px;font-family:var(--yazi)}

.marka-satir{position:relative;outline:none}
.marka-satir .ust-satir{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:12px;align-items:center;padding:9px 18px;font-size:14px;cursor:default}
.marka-satir .ust-satir small{display:block;color:var(--gri);font-size:12px}
.marka-satir .detay{display:none;padding:2px 18px 12px 18px;font-size:13.5px}
.marka-satir:hover .detay,.marka-satir:focus-within .detay,.marka-satir.acik .detay{display:block}
.marka-satir:hover,.marka-satir.acik{background:var(--kum-acik)}
.marka-satir .detay div{display:flex;justify-content:space-between;gap:12px;padding:3px 0 3px 12px;border-left:2px solid var(--mavi)}
.sekmeler{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.sekmeler button{cursor:pointer;border:1px solid var(--cizgi);background:var(--kagit);border-radius:999px;padding:5px 13px;font-size:13.5px}
.sekmeler button[aria-pressed="true"]{background:var(--mavi-acik);border-color:var(--mavi);color:var(--mavi-koyu);font-weight:600}
.grafik .deger-yazi{fill:var(--murekkep);font-size:10.5px;font-weight:600}
.grafik .adet-yazi{fill:var(--gri);font-size:10px}
.cevap-kutu{margin-top:10px}
.cevap-alan{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--cizgi);border-radius:var(--r-kucuk);background:var(--zemin);color:var(--murekkep);resize:vertical}
.cevap-alan:focus{outline:2px solid var(--mavi-koyu);outline-offset:1px}
.cevap-alt{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.cevap-durum{font-size:13px;color:var(--gri)}
.vardiya td{vertical-align:top;white-space:nowrap}
.vardiya .hucre{font-size:13.5px}
.vardiya .hucre small{display:block;font-size:11.5px;margin-top:2px}
.vardiya .off{color:var(--gri)}
.vardiya .izin{color:var(--mavi-koyu);font-weight:600}
.vardiya .bugun-sutun{background:var(--mavi-acik)}
.hafta-sec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hafta-sec strong{font-size:16px}
.uyari{background:var(--dikkat-z);border:1px solid var(--dikkat);color:var(--murekkep);border-radius:var(--r);padding:14px 18px;margin-bottom:24px;font-size:14px}
.uyari.kotu{background:var(--kotu-z);border-color:var(--kotu)}
.uyari b{display:block;margin-bottom:2px}
.bilgi{background:var(--mavi-acik);border-radius:var(--r);padding:14px 18px;font-size:14px;margin-bottom:24px;max-width:80ch}

.odeme-form{background:var(--kagit);border:1px solid var(--cizgi);border-radius:var(--r);padding:18px;margin-bottom:28px}
.odeme-izgara{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:14px 16px}
.odeme-izgara label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--gri);min-width:0}
.odeme-izgara .genis{grid-column:1/-1}
.odeme-izgara select,.odeme-izgara input{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--cizgi);border-radius:var(--r-kucuk);background:var(--zemin);color:var(--murekkep);width:100%;min-width:0}
.odeme-izgara select:focus,.odeme-izgara input:focus{outline:2px solid var(--mavi-koyu);outline-offset:1px}
.odeme-ipucu{font-size:13px;color:var(--murekkep);min-height:20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.odeme-ipucu button{cursor:pointer;border:1px solid var(--cizgi);background:var(--kum-acik);border-radius:999px;padding:1px 10px;font-size:12.5px}
.dugme.ana-dugme{background:var(--mavi-koyu);border-color:var(--mavi-koyu);color:var(--kagit);font-weight:600}
.odeme-alt{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.cevap-durum.iyi{color:var(--iyi);font-weight:600} .cevap-durum.kotu{color:var(--kotu)}
@media (max-width:760px){.odeme-izgara{grid-template-columns:1fr 1fr}.odeme-izgara .ted{grid-column:1/-1}}
.rakamlar.dort{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.rakamlar.dort{grid-template-columns:1fr 1fr}}

.yukleniyor{padding:80px 0;color:var(--gri);font-size:15px}

@media (max-width:1100px){ .iki{grid-template-columns:minmax(0,1fr)} }
@media (max-width:760px){
  .kabuk{grid-template-columns:minmax(0,1fr)}
  .yan{position:sticky;top:0;height:auto;z-index:5;padding:12px 10px;border-right:0;border-bottom:1px solid var(--cizgi)}
  .marka{display:none} .yan-alt{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:8px 11px}
  .ana{padding:22px 16px 50px}
  h1{font-size:27px}
  .rakamlar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rakam:last-child:nth-child(odd){grid-column:1/-1}
  .tablo th,.tablo td{padding:9px 10px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="kabuk">
  <aside class="yan">
    <div class="marka"><b>BAP</b><span>Yönetim paneli</span></div>
    <nav class="nav" id="nav" aria-label="Bölümler"></nav>
    <div class="yan-alt" id="yanAlt">Veri bekleniyor</div>
  </aside>
  <main class="ana" id="ana"><div class="yukleniyor">Panel verisi okunuyor…</div></main>
</div>
<script>
(function(){
"use strict";
var BOLUMLER=[["merkez","Yönetim Merkezi"],["ozet","İşletme Özeti"],["satis","Satışlar"],["finans","Finans"],["odeme","Toptancı Ödemeleri"],["alim","Alımlar & Giderler"],["stok","Ürün, Stok & Hazırlık"],["kurye","Kurye & Teslimat"],["personel","Personel"],["musteri","Müşteri İlişkileri"],["genel","Genel Bilgiler"],["kararlar","Kararlarım"],["ai","AI Ekibi"]];
var YETKI={L0:"Yalnız inceleme",L1:"Öneri ve taslak",L2:"Önceden izinli küçük işlem",L3:"Direktör yetkisinde",L4:"Senin onayın gerekiyor",L5:"Yapay zeka uygulayamaz"};
var DURUM={COMPLETED:"Tamamlandı",WAITING_MERT:"Senin onayını bekliyor",WAITING_REVIEW:"İkinci kontrol bekliyor",ROUTED:"Sıraya alındı",IN_ANALYSIS:"Analizde",NEW:"Yeni",BLOCKED:"Durduruldu",ERROR_FINAL:"Hatayla kapandı",APPROVED:"Onaylandı",REJECTED:"Reddedildi",IN_IMPLEMENTATION:"Uygulanıyor",EXECUTED:"Uygulandı",VERIFYING:"Doğrulanıyor",VERIFIED:"Doğrulandı","BOŞ":"Durumu yazılmamış"};
var VERI=null, AKTIF=(location.hash||"#merkez").slice(1), YUKLENIYOR=false;
var TL=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});
var AYLAR=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
var GUNLER=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];

function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs){for(var k in attrs){if(attrs[k]==null)continue;if(k==="class")e.className=attrs[k];else if(k==="text")e.textContent=attrs[k];else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function para(n){return TL.format(Math.round(n||0))+" ₺";}
function sure(dk){if(dk==null)return "bilinmiyor";if(dk<1)return "az önce";if(dk<60)return dk+" dk önce";var s=Math.round(dk/60);if(s<48)return s+" saat önce";return Math.round(s/24)+" gün önce";}
function gunAd(g){var d=new Date(g+"T00:00:00Z");return d.getUTCDate()+" "+AYLAR[d.getUTCMonth()];}
function tazelik(k){if(k.hata||k.dakika==null)return "kotu";if(k.dakika<=k.beklenenDk)return "iyi";if(k.dakika<=k.beklenenDk*3)return "dikkat";return "kotu";}
function kaynaklar(bolum){return (VERI&&VERI.kaynaklar||[]).filter(function(k){return !bolum||(Array.isArray(bolum)?bolum.indexOf(k.bolum)>=0:k.bolum===bolum);});}
function bekleyenSayi(){return VERI&&VERI.hub?VERI.hub.bekleyen.length:0;}

function nav(){var n=document.getElementById("nav");n.textContent="";
  BOLUMLER.forEach(function(b){var rozet=null;if(b[0]==="kararlar"&&bekleyenSayi()>0)rozet=el("span",{class:"rozet",text:String(bekleyenSayi()),"aria-label":bekleyenSayi()+" bekleyen karar"});
    n.appendChild(el("button",{type:"button","aria-current":AKTIF===b[0]?"page":null,onclick:function(){git(b[0]);}},[el("span",{text:b[1]}),rozet]));});}
function git(id){AKTIF=id;history.replaceState(null,"","#"+id);ciz();window.scrollTo(0,0);}

function ust(baslik,alt){var zaman=VERI&&VERI.olusturma?VERI.olusturma.replace("T"," ").slice(0,16):"";
  var d=el("button",{type:"button",class:"dugme",onclick:function(){yukle(true);}},["Şimdi yenile"]);if(YUKLENIYOR)d.setAttribute("disabled","");
  return el("div",{class:"ust"},[el("div",null,[el("h1",{text:baslik}),alt?el("p",{class:"alt-baslik",text:alt}):null]),el("div",{class:"yenile"},[el("span",{text:zaman?"Okundu: "+zaman:""}),d])]);}

function nabizSeridi(bolum){var liste=kaynaklar(bolum);if(!liste.length)return document.createDocumentFragment();
  var kotu=liste.filter(function(k){return tazelik(k)==="kotu";}).length;
  var serit=el("div",{class:"serit"});
  liste.forEach(function(k){var t=tazelik(k);serit.appendChild(el("a",{class:"kaynak k-"+t,href:k.link,target:"_blank",rel:"noopener",title:"Tabloyu aç"},[el("i"),k.ad+" ",el("em",{text:k.hata?"açılamadı":sure(k.dakika)})]));});
  return el("section",{class:"nabiz","aria-label":"Veri tazeliği"},[el("div",{class:"nabiz-ust"},[el("h2",{text:"Verinin tazeliği"}),el("p",{text:kotu?kotu+" kaynak beklenenden eski. Rakamları okurken bunu hesaba kat.":"Bütün kaynaklar beklenen sıklıkta güncelleniyor."})]),serit]);}

function rakam(ad,deger,not,sinif){return el("div",{class:"rakam"},[el("div",{class:"ad",text:ad}),el("div",{class:"deger",text:deger}),not?el("div",{class:"not "+(sinif||""),text:not}):null]);}
function blok(baslik,aciklama,icerik){return el("section",{class:"blok"},[el("h2",{text:baslik}),aciklama?el("p",{class:"aciklama",text:aciklama}):null,icerik]);}
function bos(m){return el("div",{class:"liste"},[el("div",{class:"bos",text:m})]);}

function hatalarKutusu(adlar){if(!VERI||!VERI.hatalar||!VERI.hatalar.length)return null;var h=VERI.hatalar.filter(function(x){return !adlar||adlar.indexOf(x.bolum)>=0;});if(!h.length)return null;
  return el("div",{class:"uyari kotu"},[el("b",{text:"Bazı veriler okunamadı"})].concat(h.map(function(x){return el("div",{text:x.mesaj});})));}

function karsilastir(bugun,gecen){if(!gecen)return {m:"Geçen haftanın bu saatinde veri yok",s:""};var f=Math.round((bugun-gecen)/gecen*100);return {m:(f>=0?"+":"")+f+"% geçen haftanın aynı saatine göre",s:f>=0?"yukari":"asagi"};}

function satisRakamlari(){var s=VERI.satis;if(!s)return bos("Satış verisi okunamadı.");var g=s.gun;var k=karsilastir(g.bugun.ciro,g.gecenHaftaAyniSaat.ciro);
  return el("div",{class:"rakamlar"},[rakam("Bugünkü ciro",para(g.bugun.ciro),k.m,k.s),rakam("Bugünkü sipariş",String(g.bugun.adet),g.gecenHaftaAyniSaat.adet?"Geçen hafta bu saatte "+g.gecenHaftaAyniSaat.adet:null),
    rakam("Ortalama sepet",g.bugun.adet?para(g.bugun.ciro/g.bugun.adet):"—",g.dun.adet?"Dün "+para(g.dun.ciro/g.dun.adet):null),
    rakam("Henüz kapanmamış",String(s.acik.adet),s.acik.adet?para(s.acik.ciro)+" yolda ya da tahsil edilmedi":"Açık sipariş yok"),
    rakam("Bu hafta",para(g.hafta.ciro),g.hafta.adet+" sipariş, Pazartesi'den bu yana")]);}
