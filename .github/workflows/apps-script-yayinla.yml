# main'deki Apps Script kodunu canlıya gönderir.
# GÜVENLİK: clasp push, projedeki depoda OLMAYAN dosyaları siler. Bu yüzden bir proje ancak
# en az bir kez "Apps Script'i Depoya Çek" ile çekilmişse (.clasp-cekim dosyası varsa) yayınlanır.
name: Apps Script'i Yayınla

# main'e apps-script/ altında değişiklik gelince yalnız değişen projeler için kendiliğinden çalışır;
# istenirse elle de başlatılır (GitHub › Actions › Run workflow, dal: main).
on:
  push:
    branches: [main]
    paths: ['apps-script/**', '!apps-script/projeler.json', '!apps-script/**/.clasp-cekim', '!apps-script/**/.clasp.json']
  workflow_dispatch:
    inputs:
      proje:
        description: "Klasör adı (ör. stok-takip-sistemi). Boş = main'de değişen projeler"
        required: false

concurrency: { group: apps-script-yayin, cancel-in-progress: false }

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: clasp kur ve oturum aç
        env: { CLASPRC_JSON: "${{ secrets.CLASPRC_JSON }}" }
        run: |
          test -n "$CLASPRC_JSON" || { echo "::error::CLASPRC_JSON gizli değeri tanımlı değil"; exit 1; }
          npm i -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Yayınlanacak projeleri belirle
        id: liste
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -n "${{ github.event.inputs.proje }}" ]; then
            liste="${{ github.event.inputs.proje }}"
          else
            once="${{ github.event.before }}"
            # Elle başlatmada (workflow_dispatch) "before" boş gelir; yalnız son commit'e bakılınca iki yayın arasındaki
            # önceki birleştirmeler atlanıyordu. Taban: main'deki son başarılı yayının commit'i.
            if [ -z "$once" ]; then
              once=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apps-script-yayinla.yml/runs?status=success&branch=main&per_page=1" \
                       --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)
              git merge-base --is-ancestor "$once" HEAD 2>/dev/null || once=""
            fi
            if [ -z "$once" ] || ! git cat-file -e "$once" 2>/dev/null; then once=HEAD~1; fi
            echo "Karşılaştırma tabanı: $once"
            liste=$(git diff --name-only "$once" HEAD -- apps-script | grep -vE '/\.clasp(-cekim|\.json)$' | awk -F/ 'NF>2{print $2}' | sort -u | tr '\n' ' ')
          fi
          echo "liste=$liste" >> "$GITHUB_OUTPUT"; echo "Projeler: $liste"
      - name: Yayınla
        run: |
          set -e
          for klasor in ${{ steps.liste.outputs.liste }}; do
            p=$(jq -c --arg k "$klasor" '.projeler[] | select(.klasor==$k)' apps-script/projeler.json)
            id=$(echo "$p" | jq -r '.scriptId // ""'); dep=$(echo "$p" | jq -r '.deploymentId // ""')
            [ -n "$id" ] || { echo "$klasor: scriptId yok, atlandı"; continue; }
            [ -f "apps-script/$klasor/.clasp-cekim" ] || { echo "::error::$klasor hiç çekilmemiş; önce 'Apps Script'i Depoya Çek' çalıştırın"; exit 1; }
            echo "::group::$klasor"
            ( cd "apps-script/$klasor"
              printf '{"scriptId":"%s","rootDir":".","fileExtension":"gs"}' "$id" > .clasp.json
              # clasp push, canlıda olup depoda olmayan dosyaları SİLER. 04.10'da Apps Script editöründe eklenmiş
              # Pluxee.gs böyle silindi, kurye bağlantısı bozuldu. Canlıda fazladan dosya varsa yayın durur.
              burasi=$PWD; gecici=$(mktemp -d)
              printf '{"scriptId":"%s","rootDir":"%s","fileExtension":"gs"}' "$id" "$gecici" > "$gecici/.clasp.json"
              ( cd "$gecici" && clasp pull >/dev/null )
              fazla=$( cd "$gecici" && find . -type f ! -name '.clasp.json' | sed 's|^\./||' | while read -r f; do [ -f "$burasi/$f" ] || echo "$f"; done )
              rm -rf "$gecici"
              if [ -n "$fazla" ]; then
                echo "::error::$klasor: canlıda depoda olmayan dosya var, yayın durduruldu (silinirdi): $(echo $fazla)."
                echo "::error::Önce 'Apps Script'i Depoya Çek' çalıştırın ve çıkan kod-cekimi dalını main'e birleştirin."
                exit 1
              fi
              clasp push -f
              # Web uygulaması olan projede adresi değiştirmeden yeni sürümü canlıya al.
              # deploymentId yazılı değilse projedeki tek sürümlü dağıtım kullanılır; birden fazlaysa durur.
              if [ -z "$dep" ] && jq -e '.webapp' appsscript.json >/dev/null 2>&1; then
                dep=$(clasp deployments | grep -E '^- ' | grep -v '@HEAD' | awk '{print $2}')
                [ "$(printf '%s\n' "$dep" | grep -c .)" = "1" ] || { echo "::error::$klasor: web dağıtımı bulunamadı ya da birden fazla; projeler.json'a deploymentId yazın"; exit 1; }
              fi
              if [ -n "$dep" ]; then clasp deploy -i "$dep" -d "git ${GITHUB_SHA::7}"; echo "$klasor: $dep yeni sürüme alındı"; fi )
            echo "::endgroup::"
          done
