# main'deki mutfak panelini (bap-sistem) ve yönetim panelini (bap-panel Worker'ı) canlıya gönderir.
# Gerekli gizli değerler: CLOUDFLARE_API_TOKEN (Pages: Edit + Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare'e Yayınla

# main'e bap-sistem/ ya da bap-panel/ değişikliği gelince kendiliğinden çalışır;
# istenirse elle de başlatılır (GitHub › Actions › Run workflow, dal: main).
on:
  push:
    branches: [main]
    paths: ['bap-sistem/**', 'bap-panel/**', 'apps-script/projeler.json']
  workflow_dispatch:
    inputs:
      hedef:
        description: "bap-sistem, bap-panel veri ikisi"
        required: true
        default: ikisi

concurrency: { group: cloudflare-yayin, cancel-in-progress: false }

jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Hedefleri belirle
        id: h
        run: |
          h="${{ github.event.inputs.hedef }}"
          if [ -z "$h" ]; then
            once="${{ github.event.before }}"
            if [ -z "$once" ] || ! git cat-file -e "$once" 2>/dev/null; then once=HEAD~1; fi
            d=$(git diff --name-only "$once" HEAD)
            echo "$d" | grep -q '^bap-sistem/' && h="$h bap-sistem"
            echo "$d" | grep -qE '^(bap-panel/|apps-script/projeler\.json$)' && h="$h bap-panel"
          fi
          [ "$h" = "ikisi" ] && h="bap-sistem bap-panel"
          echo "hedef=$h" >> "$GITHUB_OUTPUT"; echo "Hedef: $h"
      - name: Mutfak paneli (Pages › bap-sistem)
        if: contains(steps.h.outputs.hedef, 'bap-sistem')
        run: npx -y wrangler@3 pages deploy bap-sistem --project-name bap-sistem --branch main --commit-dirty=true
      - name: Yönetim paneli (Worker › bap-panel)
        if: contains(steps.h.outputs.hedef, 'bap-panel')
        run: |
          node bap-panel/build.js
          # GAS_URL depodan gelir: Veri Kapısı'nın sabit dağıtımı (projeler.json). Böylece Cloudflare'de
          # elle tutulan adres eskiyip "Apps Script adresi bulunamadı" hatası vermez.
          dep=$(jq -r '.projeler[] | select(.klasor=="bap-panel-veri-kapisi") | .deploymentId // ""' apps-script/projeler.json)
          [ -n "$dep" ] || { echo "::error::projeler.json'da bap-panel-veri-kapisi deploymentId boş"; exit 1; }
          # --keep-vars: GAS_KEY, ALLOWED_EMAIL gibi diğer ayarlara dokunmaz
          # ALIM_URL: Alım & Tedarikçi ekranının arka ucu (Kolaybi Fatura Ham Veri web uygulaması), yine projeler.json'dan
          alim=$(jq -r '.projeler[] | select(.klasor=="kolaybi-fatura-ham-veri") | .deploymentId // ""' apps-script/projeler.json)
          [ -n "$alim" ] || { echo "::error::projeler.json'da kolaybi-fatura-ham-veri deploymentId boş"; exit 1; }
          npx -y wrangler@3 deploy bap-panel/worker.js --name bap-panel --compatibility-date 2024-09-23 --keep-vars \
            --var "GAS_URL:https://script.google.com/macros/s/$dep/exec" \
            --var "ALIM_URL:https://script.google.com/macros/s/$alim/exec"
